name: Test News Engine

on:
  push:
    paths:
      - "news_engine.py"
      - "test_news_engine.py"
      - ".github/workflows/test-news-engine.yml"
  pull_request:
    paths:
      - "news_engine.py"
      - "test_news_engine.py"
      - ".github/workflows/test-news-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check files and run news engine tests
        run: |
          echo "Current directory:"
          pwd

- name: Check files and diagnose news engine
        run: |
          echo "Repository files:"
          ls -la

          echo "Exact filenames containing news:"
          python -c "import os; print([repr(f) for f in os.listdir('.') if 'news' in f.lower()])"

          echo "Checking news engine file:"
          python -c "import os; print('news_engine.py exists:', os.path.isfile('./news_engine.py'))"

          echo "Checking test file:"
          python -c "import os; print('test_news_engine.py exists:', os.path.isfile('./test_news_engine.py'))"

          echo "Finding news files:"
          find . -maxdepth 2 -type f -iname '*news*' -print

          echo "Testing news engine import:"
          python -c "import news_engine; print('News engine import successful')"

          echo "Running unit tests:"
          python -m unittest -v test_news_engine