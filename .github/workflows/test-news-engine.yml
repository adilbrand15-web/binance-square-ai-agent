name: Test News Engine

on:
  push:
    paths:
      - "news_engine.py"
      - "test_news_engine.py"
      - ".github/workflows/test-news-engine.yml"
  pull_request:
    paths:
      - "news_engine.py"
      - "test_news_engine.py"
      - ".github/workflows/test-news-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Diagnose news files
        run: |
          echo "Current directory:"
          pwd

          echo "Repository files:"
          ls -la

          echo "Exact filenames containing news:"
          python -c "import os; print([repr(f) for f in os.listdir('.') if 'news' in f.lower()])"

          echo "Check news engine file:"
          python -c "import os; print('news_engine.py exists:', os.path.isfile('./news_engine.py'))"

          echo "Check test file:"
          python -c "import os; print('test_news_engine.py exists:', os.path.isfile('./test_news_engine.py'))"

          echo "Find news files:"
          find . -maxdepth 2 -type f -iname '*news*' -print

      - name: Test news engine import
        run: python -c "import news_engine; print('News engine import successful')"

      - name: Run news engine tests
        run: python -m unittest -v test_news_engine