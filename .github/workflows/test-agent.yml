
name: Test Binance Agent

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  test-agent:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Binance Square Skill Files
        run: |
          git clone --depth 1 https://github.com/binance/binance-skills-hub.git binance-skills-hub

          SQUARE_SKILL_DIR="binance-skills-hub/skills/binance/square-post"

          test -f "$SQUARE_SKILL_DIR/SKILL.md"
          test -f "$SQUARE_SKILL_DIR/scripts/post-text.mjs"
          test -f "$SQUARE_SKILL_DIR/scripts/post-image.mjs"

          echo "BINANCE SQUARE SKILL: INSTALLED"
          echo "BINANCE SQUARE TEXT PUBLISHER: READY"
          echo "BINANCE SQUARE IMAGE PUBLISHER: READY"
          node --version

      - name: Gemini Secret Diagnostic
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY: NOT SET"
            echo "GEMINI TEST: SKIPPED"
            exit 0
          fi

          response_file="$(mktemp)"

          http_code="$(curl -sS -o "$response_file" -w '%{http_code}' -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent" \
            -H "Content-Type: application/json" \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            -d '{"contents":[{"parts":[{"text":"Reply with exactly: GEMINI_TEST_OK"}]}]}')"

          echo "HTTP STATUS: $http_code"

          python - "$response_file" "$http_code" <<'PY'
          import json
          import sys

          response_path, http_code = sys.argv[1], sys.argv[2]

          try:
              with open(response_path, "r", encoding="utf-8") as file:
                  data = json.load(file)
          except Exception:
              print("GEMINI TEST: FAILED - Invalid response")
              raise SystemExit(0)

          if not str(http_code).startswith("2"):
              error = data.get("error", {}) if isinstance(data, dict) else {}
              message = error.get("message", "Unknown API error") if isinstance(error, dict) else "Unknown API error"
              print("GEMINI TEST: FAILED")
              print(f"Safe error: {message[:200]}")
              raise SystemExit(0)

          try:
              text = data["candidates"][0]["content"]["parts"][0]["text"]
          except Exception:
              print("GEMINI TEST: FAILED - Empty response")
              raise SystemExit(0)

          print("GEMINI TEST: SUCCESS")
          print(text.strip())
          PY

      - name: Binance Square Secret Check
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        run: |
          if [ -n "$BINANCE_SQUARE_OPENAPI_KEY" ]; then
            echo "BINANCE SQUARE KEY: SET"
          else
            echo "BINANCE SQUARE KEY: NOT SET"
            exit 1
          fi

      - name: Install Chart and AI Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib groq

      - name: Restore signal database
        uses: actions/cache/restore@v4
        with:
          path: signals.db
          key: signal-database-latest
          restore-keys: |
            signal-database-

      - name: Run Binance Market Scanner
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        run: python main.py

      - name: Prepare Dashboard Website
        run: |
          test -f dashboard.html
          test -f dashboard_data.json

          mkdir -p site

          cp dashboard.html site/dashboard.html
          cp dashboard.html site/index.html
          cp dashboard_data.json site/dashboard_data.json

          echo "Dashboard HTML prepared."
          echo "Dashboard JSON prepared."
          echo "Website files:"
          ls -la site

      - name: Upload Dashboard JSON
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-data
          path: dashboard_data.json
          if-no-files-found: error
          retention-days: 30

      - name: Save signal database
        uses: actions/cache/save@v4
        with:
          path: signals.db
          key: signal-database-${{ github.run_id }}

      - name: Upload Generated Chart
        uses: actions/upload-artifact@v4
        with:
          name: selected-signal-chart
          path: charts/*.png

      - name: Upload Dashboard Website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ github.token }}

      - name: Show Dashboard URL
        run: |
          echo "===================================="
          echo "DASHBOARD URL:"
          echo "${{ steps.deployment.outputs.page_url }}"
          echo "===================================="
