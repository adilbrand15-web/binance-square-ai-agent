name: Test Binance Agent

on:
  workflow_dispatch:

jobs:
  test-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Chart Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib

      - name: Restore signal database
        uses: actions/cache/restore@v4
        with:
          path: signals.db
          key: signal-database-latest
          restore-keys: |
            signal-database-

      - name: Run Binance Market Scanner
        run: python main.py

      - name: Save signal database
        uses: actions/cache/save@v4
        with:
          path: signals.db
          key: signal-database-${{ github.run_id }}