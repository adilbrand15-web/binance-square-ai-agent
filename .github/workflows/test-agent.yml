name: Test Binance Agent

on:
  workflow_dispatch:

jobs:
  test-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Binance Square Skill Files
        run: |
          git clone --depth 1 https://github.com/binance/binance-skills-hub.git binance-skills-hub

          SQUARE_SKILL_DIR="binance-skills-hub/skills/binance/square-post"

          if [ ! -f "$SQUARE_SKILL_DIR/SKILL.md" ]; then
            echo "BINANCE SQUARE SKILL: FAILED"
            echo "SKILL.md not found"
            exit 1
          fi

          if [ ! -f "$SQUARE_SKILL_DIR/scripts/post-text.mjs" ]; then
            echo "BINANCE SQUARE TEXT PUBLISHER: FAILED"
            echo "post-text.mjs not found"
            exit 1
          fi

          if [ ! -f "$SQUARE_SKILL_DIR/scripts/post-image.mjs" ]; then
            echo "BINANCE SQUARE IMAGE PUBLISHER: FAILED"
            echo "post-image.mjs not found"
            exit 1
          fi

          echo "BINANCE SQUARE SKILL: INSTALLED"
          echo "BINANCE SQUARE TEXT PUBLISHER: READY"
          echo "BINANCE SQUARE IMAGE PUBLISHER: READY"

          echo "Node version:"
          node --version

      - name: Gemini Secret Diagnostic
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY: SET"
          else
            echo "GEMINI_API_KEY: NOT SET"
          fi

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "HTTP STATUS: 0"
            echo "GEMINI TEST: FAILED"
            echo "safe error message: Secret not configured"
            exit 0
          fi

          response_file="$(mktemp)"

          http_code="$(curl -sS -o "$response_file" -w '%{http_code}' -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent" \
            -H "Content-Type: application/json" \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            -d '{"contents":[{"parts":[{"text":"Reply with exactly: GEMINI_TEST_OK"}]}]}')"

          echo "HTTP STATUS: $http_code"

          python - "$response_file" "$http_code" <<'PY'
          import json
          import sys

          response_path, http_code = sys.argv[1], sys.argv[2]

          try:
              with open(response_path, "r", encoding="utf-8") as file:
                  data = json.load(file)
          except Exception as exc:
              print("GEMINI TEST: FAILED")
              print(
                  f"safe error message: "
                  f"{type(exc).__name__}: {str(exc)[:200]}"
              )
              raise SystemExit(0)

          if not str(http_code).startswith("2"):
              print("GEMINI TEST: FAILED")

              error = data.get("error", {}) if isinstance(data, dict) else {}

              message = (
                  error.get("message")
                  if isinstance(error, dict)
                  else "Unknown Gemini API error"
              )

              print(f"safe error message: {message[:200]}")
              raise SystemExit(0)

          try:
              text = data["candidates"][0]["content"]["parts"][0]["text"]
          except Exception:
              print("GEMINI TEST: FAILED")
              print(
                  "safe error message: "
                  "Empty or invalid response from Gemini"
              )
              raise SystemExit(0)

          print("GEMINI TEST: SUCCESS")
          print(text.strip())
          PY

      - name: Binance Square Secret Check
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        run: |
          if [ -n "$BINANCE_SQUARE_OPENAPI_KEY" ]; then
            echo "BINANCE SQUARE KEY: SET"
          else
            echo "BINANCE SQUARE KEY: NOT SET"
            exit 1
          fi

      - name: Install Chart and AI Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib groq

      - name: Restore signal database
        uses: actions/cache/restore@v4
        with:
          path: signals.db
          key: signal-database-latest
          restore-keys: |
            signal-database-

      - name: Run Binance Market Scanner
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python main.py

      - name: Save signal database
        uses: actions/cache/save@v4
        with:
          path: signals.db
          key: signal-database-${{ github.run_id }}

      - name: Upload Generated Chart
        uses: actions/upload-artifact@v4
        with:
          name: selected-signal-chart
          path: charts/*.png