name: Test Groq AI

on:
  workflow_dispatch:

jobs:
  test-groq:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Groq SDK
        run: |
          python -m pip install --upgrade pip
          pip install groq

      - name: Test Groq API
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from groq import Groq

          print("======================================")
          print("GROQ API TEST - OFFICIAL PYTHON SDK")
          print("======================================")

          try:
              client = Groq(
                  api_key=os.environ["GROQ_API_KEY"]
              )

              response = client.chat.completions.create(
                  model="openai/gpt-oss-20b",
                  messages=[
                      {
                          "role": "user",
                          "content": "Reply with exactly: GROQ_TEST_OK"
                      }
                  ],
                  temperature=0
              )

              text = response.choices[0].message.content.strip()

              print("HTTP/API TEST: SUCCESS")
              print("GROQ RESPONSE:")
              print(text)

          except Exception as error:
              print("HTTP/API TEST: FAILED")
              print(f"ERROR TYPE: {type(error).__name__}")
              print(f"ERROR: {error}")
              raise
          PY